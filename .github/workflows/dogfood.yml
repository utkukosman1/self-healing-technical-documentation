name: DocSentry self-check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: DocSentry mode
        required: true
        default: check
        type: choice
        options: [check, fix]

jobs:
  docsentry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          mode: ${{ github.event.inputs.mode || 'check' }}
          reviewer: utkukosman1