name: DocSentry self-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: DocSentry mode
        required: true
        default: check
        type: choice
        options: [check, fix]

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'fix')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          mode: check
          reviewer: utkukosman1

  fix:
    if: >-
      (github.event_name == 'push' && vars.DOCSENTRY_AUTO_HEAL == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'fix')
    runs-on: ubuntu-latest
    concurrency:
      group: docsentry-fix
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          mode: fix
          reviewer: utkukosman1