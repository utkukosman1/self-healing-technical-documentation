name: DocSentry
description: Detects stale documentation caused by code changes, flags discrepancies, and optionally opens a PR with corrected docs.

branding:
  icon: file-text
  color: blue

inputs:
  openai-api-key:
    description: OpenAI API key, required for check and fix modes only.
    required: false
  typesafe-api-key:
    description: TypeSafe API key, required for review mode with jev-provider typesafe.
    required: false
  openrouter-api-key:
    description: OpenRouter API key, required for review mode with jev-provider openrouter.
    required: false
  jev-provider:
    description: 'Jev API provider: typesafe or openrouter (review mode only).'
    required: false
    default: typesafe
  jev-model:
    description: 'Jev model; empty selects jev-latest for TypeSafe or typesafe/jev-1.13 for OpenRouter.'
    required: false
    default: ''
  github-token:
    description: GitHub token for posting comments and creating PRs.
    required: false
    default: ${{ github.token }}
  mode:
    description: 'check (stale docs), fix (open docs PR), or review (Jev PR triage).'
    required: false
    default: check
  docs-glob:
    description: Comma-separated glob patterns for documentation files.
    required: false
    default: README.md,docs/**/*.md
  chat-model:
    description: OpenAI model used for staleness verdicts and rewrites.
    required: false
    default: gpt-4.1-mini
  embedding-model:
    description: OpenAI model used for embeddings.
    required: false
    default: text-embedding-3-small
  max-sections:
    description: Maximum number of doc sections to analyze per run (cost cap).
    required: false
    default: "20"
  fail-on-stale:
    description: Fail the check when stale docs are found (check mode only).
    required: false
    default: "false"
  reviewer:
    description: GitHub username to auto-request review from (fix mode only).
    required: false
    default: ""

outputs:
  review-verdict:
    description: 'Review outcome: no_concerns_detected, needs_attention, insufficient_context, unavailable, or skipped.'
    value: ${{ steps.run.outputs.review-verdict }}
  review-head-sha:
    description: PR head commit evaluated in review mode, empty if unavailable.
    value: ${{ steps.run.outputs.review-head-sha }}
  result:
    description: Summary of the run (counts of analyzed/ok/stale sections).
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      if: inputs.mode != 'review'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      shell: bash
      run: pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Run DocSentry
      id: run
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        DOCSENTRY_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        DOCSENTRY_TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        DOCSENTRY_OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        DOCSENTRY_JEV_PROVIDER: ${{ inputs.jev-provider }}
        DOCSENTRY_JEV_MODEL: ${{ inputs.jev-model }}
        DOCSENTRY_GITHUB_TOKEN: ${{ inputs.github-token }}
        DOCSENTRY_MODE: ${{ inputs.mode }}
        DOCSENTRY_DOCS_GLOB: ${{ inputs.docs-glob }}
        DOCSENTRY_CHAT_MODEL: ${{ inputs.chat-model }}
        DOCSENTRY_EMBEDDING_MODEL: ${{ inputs.embedding-model }}
        DOCSENTRY_MAX_SECTIONS: ${{ inputs.max-sections }}
        DOCSENTRY_FAIL_ON_STALE: ${{ inputs.fail-on-stale }}
        DOCSENTRY_REVIEWER: ${{ inputs.reviewer }}
      # Exclude the caller's working directory from module resolution.
      run: python -P -m src.main
